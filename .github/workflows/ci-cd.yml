name: FA2 CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask prometheus-client

      - name: Run backend unit tests
        shell: powershell
        run: python -m unittest discover -s tests -v

      - name: Check Docker and Kubernetes
        shell: powershell
        run: |
          docker info
          kubectl get nodes

      - name: Build backend image
        shell: powershell
        run: docker build -t "devops-fa1-backend:${{ github.sha }}" ./docker/backend

      - name: Build frontend image
        shell: powershell
        run: docker build -t "devops-fa1-frontend:${{ github.sha }}" ./docker/frontend

      - name: Deploy backend
        shell: powershell
        run: kubectl set image deployment/backend backend=devops-fa1-backend:${{ github.sha }}

      - name: Deploy frontend
        shell: powershell
        run: kubectl set image deployment/frontend frontend=devops-fa1-frontend:${{ github.sha }}

      - name: Verify backend rollout
        shell: powershell
        run: kubectl rollout status deployment/backend --timeout=120s

      - name: Verify frontend rollout
        shell: powershell
        run: kubectl rollout status deployment/frontend --timeout=120s

      - name: Verify deployment
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods